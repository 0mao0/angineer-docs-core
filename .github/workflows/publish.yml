name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        # 独立仓没有仓库树与 .env：tests/conftest.py 会补数据根与向量后端默认值，
        # 需要 docs-api 的跨服务用例自动跳过（预期 507 passed / 17 skipped）。
        run: pytest tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        run: |
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != pyproject version $PKG（先 bump 版本再打 tag）"
            exit 1
          fi
      - name: Verify package __version__ matches pyproject version
        run: |
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SRC=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/docs_core/__init__.py').read_text(encoding='utf-8')).group(1))")
          if [ "$SRC" != "$PKG" ]; then
            echo "::error::src/docs_core/__init__.py __version__ $SRC != pyproject version $PKG"
            exit 1
          fi
      - name: Verify the wheel ships the popo fork
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["popo/post_processing/label_normalization.py",
                  "popo/post_processing/run_inference.py",
                  "popo/post_processing/get_json_tree.py",
                  "docs_core/step04_structure/popo/popo_signal_aligner.py"]
          missing = [n for n in need if n not in names]
          if missing:
              raise SystemExit(f"::error::wheel 缺少 PoPo 源文件: {missing}")
          junk = [n for n in names if n.startswith(("popo/figures/", "popo/output_cases/", "popo/outputs/"))]
          if junk:
              raise SystemExit(f"::error::wheel 混入 PoPo 产物目录: {junk[:5]}")
          print(f"popo 源文件齐全，产物目录 0 混入（wheel {len(names)} 条目）")
          PY
      - name: Check distributions
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/angineer-docs-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
